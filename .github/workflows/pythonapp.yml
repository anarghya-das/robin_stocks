name: Python package

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install fork
        run: python -m pip install .
      - name: Test without brokerage credentials or API calls
        run: |
          python -m unittest discover -s tests -p test_fork_compatibility.py -v
          python -m unittest discover -s tests -p test_filter_data.py -v
          python -m compileall -q calcap_robin_stocks
